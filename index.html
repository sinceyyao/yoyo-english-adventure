<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b9dafa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Yoyo English"><link rel="manifest" href="manifest.webmanifest"><title>Yoyo's English Adventure</title><style>
:root{font-family:ui-rounded,'Arial Rounded MT Bold',system-ui,-apple-system,sans-serif;color:#263354;background:#f4f8ff}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100dvh;padding:18px 18px 110px;background:linear-gradient(#dceeff 0,#f9f7ff 330px,#fff 700px)}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;line-height:1.15;margin:14px 0 4px}h2{font-size:21px;margin:6px 0 12px}p{line-height:1.5}.muted{color:#66718b;font-size:14px}.pill{background:white;padding:9px 13px;border-radius:30px;font-weight:800;color:#6656a7;box-shadow:0 4px 15px #aac4e044}.hero{background:linear-gradient(140deg,#86c8f6,#a6a0ef);border-radius:27px;color:white;padding:24px 22px;margin:20px 0;box-shadow:0 12px 25px #91b9df55;position:relative;overflow:hidden}.hero h2{font-size:29px;margin:5px 0}.hero .art{font-size:60px;text-align:right}.hero p{margin:5px 0;color:#fff}.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px}.tile,.panel{border:0;background:white;border-radius:22px;padding:18px;box-shadow:0 5px 17px #b6c8e62e;text-align:left;color:inherit}.tile{min-height:140px;display:flex;flex-direction:column;justify-content:space-between}.tile .emoji{font-size:38px}.tile b{font-size:17px}.tile small{color:#7a84a0}.button{border:0;background:#7568d9;color:white;border-radius:17px;padding:15px 20px;font-size:16px;font-weight:800;cursor:pointer}.button.secondary{background:#e9e8ff;color:#5148a8}.button:disabled{opacity:.4}.wide{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#fffffff2;backdrop-filter:blur(12px);padding:10px 8px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -5px 20px #b4c2df40}.nav button{border:0;background:none;color:#78849e;font-weight:750;font-size:12px;padding:5px 12px}.nav button.active{color:#6859ca}.nav span{display:block;font-size:24px;margin-bottom:3px}.back{border:0;background:#ffffffad;border-radius:12px;padding:10px 13px;color:#594da5;font-weight:800}.flash{background:white;border-radius:30px;padding:25px 20px;text-align:center;box-shadow:0 8px 25px #bac8e43b;margin:18px 0}.flash .big{font-size:110px;min-height:165px;display:grid;place-items:center}.flash h2{font-size:35px;margin:8px}.flash .sentence{font-size:18px;color:#53637f}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.progress{height:9px;border-radius:99px;background:#e5e8f7;overflow:hidden;margin:13px 0}.progress>div{height:100%;background:#8a78e9;border-radius:99px;transition:width .2s}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.choice{border:3px solid transparent;border-radius:22px;background:white;min-height:132px;padding:10px;box-shadow:0 5px 15px #b4c8e530;color:#334;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}.choice .picture{font-size:59px}.choice .choiceText{font-size:14px;line-height:1.25;font-weight:700}.choice.correct{border-color:#42c49c;background:#effff8}.choice.wrong{border-color:#ff9a9a;background:#fff4f3}.question{font-size:25px;text-align:center;margin:18px 0 4px}.scene{font-size:70px;text-align:center;padding:15px}.feedback{padding:15px;border-radius:18px;background:#f0edff;margin:12px 0;font-weight:700}.sectionlabel{font-size:13px;color:#7c83a0;font-weight:900;letter-spacing:1px;margin:24px 0 10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:white;border-radius:20px;padding:20px;text-align:center}.stat strong{display:block;font-size:32px;color:#7064cc}.wordchips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:25px;background:#e9e9fb;padding:9px 12px;font-weight:700;font-size:13px}.switch{display:flex;gap:8px;margin:15px 0}.switch button{border:0;border-radius:14px;padding:12px;background:white;color:#68738d;flex:1;font-weight:800}.switch button.on{background:#7669d7;color:white}.hint{font-size:13px;color:#7b829a}.celebrate{text-align:center;font-size:70px;margin:25px 0}.speak{border:0;background:#e5f4ff;color:#327ab2;border-radius:16px;padding:13px 17px;font-weight:800}.hidden{display:none}@media(min-width:550px){.app{margin-top:10px;border-radius:28px;min-height:calc(100dvh - 10px)}}
</style></head><body><div id="root" class="app"></div><script>
const words=[['sun','☀️','I can see the sun.'],['moon','🌙','I can see the moon.'],['star','⭐','I can see a star.'],['cloud','☁️','I can see a cloud.'],['rainbow','🌈','I can see a rainbow.'],['bird','🦅','I can see a bird.'],['airplane','✈️','I can see an airplane.'],['rain','🌧️','I can see rain.'],['kite','🪁','I can see a kite.'],['helicopter','🚁','I can see a helicopter.'],['rocket','🚀','I can see a rocket.'],['planet','🌍','I can see a planet.'],['hot air balloon','🎈','I can see a hot air balloon.'],['snow','❄️','I can see snow.'],['lightning','⚡','I can see lightning.'],['comet','☄️','I can see a comet.'],['satellite','🛰️','I can see a satellite.'],['blimp','🎈','I can see a blimp.'],['aurora borealis','🌌','I can see the northern lights.'],['bat','🦇','I can see a bat.']];
const quiz=[{q:'Find the sun!',a:0,opts:[0,1,2,3]},{q:'Where is the moon?',a:1,opts:[4,0,1,6]},{q:'Find the rainbow!',a:4,opts:[3,4,7,2]},{q:'Find the airplane!',a:6,opts:[9,5,10,6]},{q:'Where is the star?',a:2,opts:[1,0,2,4]},{q:'Find the clouds!',a:3,opts:[3,13,7,1]},{q:'What can you see at night?',a:1,opts:[0,1,4,8]},{q:'What can you see on a sunny day?',a:0,opts:[0,13,14,1]},{q:'Which one can fly in the sky?',a:6,opts:[11,3,6,7]},{q:'I can see the sun and clouds.',scene:'☀️ ☁️',a:0,opts:[1,0,4,2]},{q:'I can see the moon and stars.',scene:'🌙 ⭐ ⭐',a:1,opts:[0,6,4,1]},{q:'I can see a rainbow and a bird.',scene:'🌈 🦅',a:4,opts:[4,1,10,0]}];
const key='yoyo_sky_v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{seen:[],sessions:[],misses:{}}}catch(e){data={seen:[],sessions:[],misses:{}}}let view='home',wordIndex=0,filter='core',qi=0,selected=null,wrongThisRun=[],firstTry={},finished=false;
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}function speak(s){if(!('speechSynthesis'in window)){alert('This browser does not support speech.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.78;u.pitch=1.08;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-US'&&/Samantha|female|Ava/i.test(v.name))||voices.find(v=>v.lang==='en-US')||null;speechSynthesis.speak(u)}function go(v){view=v;render();window.scrollTo(0,0)}function head(title,sub=''){return `<header><button class="back" onclick="go('home')">← Home</button><span class="pill">⭐ Yoyo</span></header><h1>${title}</h1><div class="muted">${sub}</div>`}function nav(){return `<div class="nav">${[['home','🏠','Home'],['learn','📚','Learn'],['quiz','🎮','Quiz'],['progress','🌟','Progress']].map(([v,e,t])=>`<button class="${view===v?'active':''}" onclick="${v==='quiz'?'startQuiz()':`go('${v}')`}"><span>${e}</span>${t}</button>`).join('')}</div>`}
function render(){const root=document.getElementById('root');let html='';if(view==='home'){html=`<header><span class="pill">☁️ Yoyo's English</span><span class="pill">⭐ ${data.sessions.length} plays</span></header><h1>Hello, Yoyo! 👋</h1><div class="muted">Ready for an English adventure?</div><div class="hero"><div class="art">☀️ ☁️ 🌈</div><h2>Sky Explorer</h2><p>What can you see in the sky?</p><br><button class="button" style="background:white;color:#6254b4" onclick="go('learn')">Let's explore →</button></div><div class="cards"><button class="tile" onclick="go('learn')"><span class="emoji">📚</span><b>Learn Words</b><small>20 picture cards</small></button><button class="tile" onclick="startQuiz()"><span class="emoji">🎮</span><b>Play Quiz</b><small>12 fun questions</small></button><button class="tile" onclick="go('review')"><span class="emoji">🔁</span><b>Review</b><small>Practice tricky words</small></button><button class="tile" onclick="go('progress')"><span class="emoji">🌟</span><b>My Stars</b><small>Learning progress</small></button></div><p class="hint">Made for Yoyo · Wonders GK Unit 8 Week 3</p>`}
if(view==='learn'){let ids=filter==='core'?words.slice(0,8).map((_,i)=>i):words.slice(8).map((_,i)=>i+8);if(!ids.includes(wordIndex))wordIndex=ids[0];const w=words[wordIndex],pos=ids.indexOf(wordIndex);if(!data.seen.includes(wordIndex)){data.seen.push(wordIndex);save()}html=head('Learn the Sky','Tap the speaker and say it aloud!')+`<div class="switch"><button class="${filter==='core'?'on':''}" onclick="setFilter('core')">⭐ Core · 8</button><button class="${filter==='more'?'on':''}" onclick="setFilter('more')">🚀 More · 12</button></div><div class="row"><span class="muted">Card ${pos+1} of ${ids.length}</span><span class="pill">${filter==='core'?'Must learn':'Explore'}</span></div><div class="progress"><div style="width:${(pos+1)/ids.length*100}%"></div></div><div class="flash"><div class="big">${w[1]}</div><h2>${w[0]}</h2><button class="speak" onclick="speak('${w[0]}')">🔊 Listen</button><p class="sentence">${w[2]}</p><button class="speak" onclick="speak('${w[2]}')">🔊 Say the sentence</button></div><div class="row"><button class="button secondary" onclick="moveWord(-1)">← Previous</button><button class="button" onclick="moveWord(1)">Next →</button></div>`}
if(view==='quiz'){const x=quiz[qi];const phase=qi<6?'LEVEL 1 · LOOK & FIND':qi<9?'LEVEL 2 · SKY DETECTIVE':'LEVEL 3 · SAY IT!';html=head('Sky Quiz','Listen, look, and choose!')+`<div class="row"><b>${phase}</b><span class="pill">${qi+1} / 12</span></div><div class="progress"><div style="width:${qi/12*100}%"></div></div>${x.scene?`<div class="scene">${x.scene}</div>`:''}<h2 class="question">${x.q}</h2><div style="text-align:center"><button class="speak" onclick="speak(quiz[qi].q)">🔊 Listen to the question</button></div><div class="choices">${x.opts.map(id=>{const w=words[id];let cls=selected===id?(id===x.a?'correct':'wrong'):'';return `<button class="choice ${cls}" onclick="choose(${id})"><span class="picture">${w[1]}</span>${selected!==null?`<span class="choiceText">${w[0]}</span>`:''}</button>`}).join('')}</div>${selected!==null?`<div class="feedback">${selected===x.a?'🌟 Great job!':'💜 Try again!'} ${selected===x.a?`<button class="speak" onclick="speak('${words[x.a][2]}')">🔊 ${words[x.a][2]}</button>`:''}</div>`:''}<button class="button wide" ${selected!==x.a?'disabled':''} onclick="nextQuestion()">${qi===11?'Finish 🎉':'Next →'}</button>`}
if(view==='result'){const score=Object.values(firstTry).filter(Boolean).length;html=head('Amazing, Yoyo!','You finished your sky adventure!')+`<div class="celebrate">🏆🌟🎉</div><div class="flash"><h2>${score} / 12</h2><p>First-try correct answers</p><p>Keep exploring the sky!</p><button class="button wide" onclick="startQuiz()">Play Again</button></div><button class="button secondary wide" onclick="go('progress')">See My Progress</button>`}
if(view==='progress'){let total=data.sessions.length,avg=total?Math.round(data.sessions.reduce((a,b)=>a+b.score,0)/total):0;let tricky=Object.entries(data.misses).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);html=head('My Learning Stars','Your adventure stays on this device.')+`<div class="stats"><div class="stat"><strong>${data.seen.length}/20</strong><span>Words explored</span></div><div class="stat"><strong>${total}</strong><span>Quiz sessions</span></div><div class="stat"><strong>${avg}/12</strong><span>Average first try</span></div><div class="stat"><strong>${total?Math.max(...data.sessions.map(s=>s.score)):0}/12</strong><span>Best score</span></div></div><div class="sectionlabel">WORDS TO PRACTICE</div><div class="panel">${tricky.length?`<div class="wordchips">${tricky.map(([k,v])=>`<span class="chip">${words[k][1]} ${words[k][0]} · ${v}</span>`).join('')}</div>`:'No tricky words yet. Play a quiz to begin!'}<br><button class="button secondary wide" onclick="go('review')">Practice these words</button></div><div class="sectionlabel">RECENT SESSIONS</div><div class="panel">${data.sessions.length?data.sessions.slice(-5).reverse().map(s=>`<p>⭐ ${s.score}/12 · ${new Date(s.time).toLocaleDateString()}</p>`).join(''):'No quiz completed yet.'}</div><p class="hint">Progress is saved only in this browser. Clearing website data may erase it.</p>`}
if(view==='review'){let ids=Object.entries(data.misses).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k])=>Number(k));html=head('Practice Time','Listen and repeat your tricky words.')+(ids.length?ids.map(id=>`<div class="panel" style="margin:12px 0;display:flex;align-items:center;gap:15px"><span style="font-size:50px">${words[id][1]}</span><div style="flex:1"><b>${words[id][0]}</b><p class="hint">${words[id][2]}</p></div><button class="speak" onclick="speak('${words[id][0]}')">🔊</button></div>`).join(''):'<div class="flash">🌟 No tricky words yet!<p>Play a quiz to discover what to practice.</p></div>')+`<button class="button wide" onclick="startQuiz()">Play Quiz</button>`}
root.innerHTML=html+nav()}
function setFilter(f){filter=f;wordIndex=f==='core'?0:8;render()}function moveWord(d){let ids=filter==='core'?[...Array(8).keys()]:[...Array(12).keys()].map(x=>x+8);wordIndex=ids[(ids.indexOf(wordIndex)+d+ids.length)%ids.length];render()}function startQuiz(){qi=0;selected=null;wrongThisRun=[];firstTry={};go('quiz')}function choose(id){const x=quiz[qi];if(selected===x.a)return;if(firstTry[qi]===undefined)firstTry[qi]=id===x.a;if(id!==x.a){data.misses[x.a]=(data.misses[x.a]||0)+1;wrongThisRun.push(x.a);save()}selected=id;render();if(id===x.a)speak(words[id][2])}function nextQuestion(){if(selected!==quiz[qi].a)return;if(qi===11){data.sessions.push({time:Date.now(),score:Object.values(firstTry).filter(Boolean).length});save();go('result')}else{qi++;selected=null;render();window.scrollTo(0,0)}}
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
